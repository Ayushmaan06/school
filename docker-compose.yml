# ADR-012 permits Docker Compose with Postgres and nothing else. Adding a second
# service to this file needs an ADR.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: school_intel
      POSTGRES_PASSWORD: school_intel
      POSTGRES_DB: school_intel
    ports: ["5433:5432"]  # 5432 is commonly taken by another project
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_intel"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

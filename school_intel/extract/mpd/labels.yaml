  - counsellor and wellness teacher
  - career counsellor
  - career counselor
  - wellness teacher
  - counsellor
  - counselor

pincode:
  - complete address with pin code
  - address with pin code
  - pin code
  - pincode

total_enrollment:
  - total students
  - total strength
  - total enrolment
  - total enrollment
  - total no. of students
